<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!--ARTIFACT-START-->
<title>Misión Ares 2050</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#120d16">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one-screen mobile console. Isometric crater map fills the screen; navy/cream module-style HUD floats on top, action bar at the bottom, dialogs rise as bottom sheets. */
:root{
  --night:#120d16;      /* cielo marciano */
  --navy:#222a4c;       /* casco de los módulos */
  --navy-2:#2e3866;
  --navy-3:#3c4880;
  --cream:#e9e4d6;      /* paneles blancos de los módulos */
  --gold:#d8ab4c;       /* ribete dorado */
  --ink:#f5f1e8;
  --muted:#aab2cc;
  --rust:#c8552b;       /* suelo marciano */
  --glass:#8fd8ec;      /* cúpulas y oxígeno */
  --good:#86d98f; --warn:#f2c14e; --bad:#ff6b5a;
  --display:"Pixelify Sans", "Courier New", monospace;
  --body:"Nunito", "Segoe UI", system-ui, sans-serif;
  --bevel: inset 0 2px 0 rgba(255,255,255,.12), inset 0 -3px 0 rgba(0,0,0,.35);
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.screen{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.gutter{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.02em;font-weight:700}
.btn{background:var(--gold);color:var(--navy);font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:.04em;
  padding:13px 22px;border-radius:6px;border:2px solid #f6dc9a;box-shadow:var(--bevel),0 4px 0 #7a5a1c;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:var(--bevel),0 1px 0 #7a5a1c}
.btn.ghost{background:var(--navy-2);color:var(--cream);border-color:var(--cream);box-shadow:var(--bevel),0 4px 0 #11152a}
.btn[disabled]{opacity:.4;pointer-events:none}
.panel{background:var(--navy);border:2px solid var(--cream);border-radius:6px;box-shadow:var(--bevel),0 0 0 2px #0d1022}

/* ---------- Pantallas de historia ---------- */
#title,#story,#crew,#travel,#end{justify-content:center;align-items:center;text-align:center;gap:16px;padding-block:24px}
.heroImg{width:min(360px,86vw);filter:drop-shadow(0 16px 20px rgba(0,0,0,.6))}
.logo{font-family:var(--display);font-weight:700;line-height:.95}
.logo .y{display:block;font-size:.95rem;letter-spacing:.3em;color:var(--gold);margin-bottom:6px}
.logo .n{display:block;font-size:clamp(2.8rem,14vw,5rem);color:var(--cream);text-shadow:0 4px 0 var(--navy),0 0 24px rgba(200,85,43,.55)}
.tag{color:var(--muted);max-width:32ch;line-height:1.5;margin:0}
.stack{display:flex;flex-direction:column;gap:12px;width:min(320px,100%)}
#storyArt{width:min(260px,68vw);height:min(260px,68vw)}
.storyText{max-width:32ch;font-size:1.1rem;line-height:1.55;min-height:7.5em;margin:0}
.dots{display:flex;gap:8px}
.dots i{width:10px;height:10px;background:var(--navy-3)}
.dots i.on{background:var(--gold)}
#crew{justify-content:flex-start;overflow-y:auto}
#crew h2{font-size:1.6rem;margin-top:8px}
.field{display:flex;flex-direction:column;gap:6px;width:min(360px,100%);text-align:left}
.field label{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.field input{font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:6px;border:2px solid var(--cream);background:var(--navy);color:var(--ink);user-select:text}
.crewGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(420px,100%)}
.crewCard{background:var(--navy);border:2px solid var(--navy-3);border-radius:6px;padding:12px 10px;text-align:left;display:flex;flex-direction:column;gap:4px;box-shadow:var(--bevel)}
.crewCard .face{font-size:2rem}
.crewCard b{font-family:var(--display);font-size:1.02rem}
.crewCard span{font-size:.8rem;color:var(--muted);line-height:1.35}
.crewCard.sel{border-color:var(--gold);background:var(--navy-2)}
.hint{font-size:.85rem;color:var(--muted);margin:0}
#travelArt{width:min(340px,90vw);height:150px}
.bar{width:min(320px,85vw);height:14px;background:var(--navy);border:2px solid var(--cream);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--gold) 0 10px,#b88a32 10px 12px)}
.fact{background:var(--navy-2);border:2px solid var(--navy-3);border-radius:6px;padding:12px 14px;max-width:34ch;line-height:1.5;font-size:.95rem;text-align:left}
.fact b{color:var(--glass);font-family:var(--display);font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:4px}

/* ---------- Juego ---------- */
#game{gap:0}
#mapCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:0;cursor:grab}
.hud{position:relative;z-index:2;padding-top:8px;padding-bottom:8px;display:flex;flex-direction:column;gap:6px;
  background:linear-gradient(rgba(18,13,22,.96),rgba(18,13,22,.82));border-bottom:2px solid var(--navy-3)}
.hudTop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sol{font-family:var(--display);font-weight:700;font-size:1.4rem;letter-spacing:.04em;line-height:1}
.sol small{display:block;font-family:var(--body);font-size:.62rem;letter-spacing:.16em;color:var(--muted);font-weight:800;margin-top:3px}
.status{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:.72rem;font-weight:800;padding:4px 9px;border-radius:4px;background:var(--navy-2);border:1px solid var(--navy-3);white-space:nowrap}
.pill.storm{background:#5c3a1c;border-color:var(--warn);color:var(--warn)}
.pill.cold{background:#1c3a44;border-color:var(--glass);color:var(--glass)}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.chip{background:var(--navy);border:1px solid var(--navy-3);border-radius:5px;padding:3px 6px;display:flex;flex-direction:column;align-items:flex-start;min-width:0;box-shadow:var(--bevel)}
.chip .k{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-weight:800}
.chip .v{font-family:var(--display);font-weight:700;font-size:1.08rem;font-variant-numeric:tabular-nums;line-height:1.05;white-space:nowrap}
.chip .v .ic{font-style:normal;font-size:.8em;margin-right:3px}
.chip .d{font-size:.66rem;font-weight:800;font-variant-numeric:tabular-nums}
.chip.low{border-color:var(--bad);animation:blink 1s infinite}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}
@keyframes blink{50%{background:#4a1c28}}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meter{display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:800;color:var(--muted)}
.meter .track{flex:1;height:9px;background:var(--navy);overflow:hidden;border:1px solid var(--navy-3)}
.meter .track i{display:block;height:100%;transition:width .4s}
.mission{display:flex;align-items:center;gap:10px;background:var(--navy-2);border:2px solid var(--cream);border-radius:6px;padding:6px 10px;text-align:left;width:100%;box-shadow:var(--bevel)}
.mission .num{font-family:var(--display);font-weight:700;color:var(--navy);background:var(--gold);border-radius:3px;padding:2px 7px;font-size:.85rem}
.mission .txt{font-size:.85rem;line-height:1.3;flex:1;min-width:0;font-weight:700}
.mission .txt small{display:block;color:var(--muted);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase}
.mapwrap{flex:1;min-height:0;position:relative}
.mapTools{position:absolute;right:max(12px, env(safe-area-inset-right,0px));top:12px;display:flex;flex-direction:column;gap:8px;z-index:2}
.mapTools button{width:44px;height:44px;font-family:var(--display);font-size:1.4rem;font-weight:700;display:grid;place-items:center}
.placeBar{position:absolute;left:0;right:0;bottom:10px;z-index:3;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.placeBar .panel{padding:10px 12px;display:flex;align-items:center;gap:10px}
.placeBar img{width:52px;height:40px;object-fit:contain}
.placeBar .msg{flex:1;font-size:.86rem;line-height:1.3;font-weight:700}
.placeBar .msg b{font-family:var(--display);font-size:1rem;display:block}
.placeBar .row .btn{font-size:1rem}
.actions{position:relative;z-index:2;display:flex;gap:8px;align-items:stretch;padding-top:8px;padding-bottom:max(10px, env(safe-area-inset-bottom,0px));
  background:linear-gradient(rgba(18,13,22,.82),rgba(18,13,22,.96));border-top:2px solid var(--navy-3)}
.iconBtn{background:var(--navy);border:2px solid var(--navy-3);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:1.25rem;min-width:58px;box-shadow:var(--bevel)}
.iconBtn small{font-size:.6rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.iconBtn.build{border-color:var(--gold)}
.next{flex:1;font-size:1rem;padding-inline:8px;white-space:nowrap}
.float{position:fixed;pointer-events:none;font-family:var(--display);font-weight:700;font-size:1.1rem;animation:rise 1.2s ease-out forwards;z-index:5;text-shadow:0 2px 0 #000}
@keyframes rise{to{transform:translateY(-40px);opacity:0}}

/* ---------- Hojas / modales ---------- */
.veil{position:fixed;inset:0;background:rgba(8,6,14,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--navy);border:2px solid var(--cream);border-bottom:0;border-radius:10px 10px 0 0;width:min(560px,100%);max-height:86%;overflow-y:auto;
  padding-top:16px;padding-bottom:max(18px, env(safe-area-inset-bottom,0px));animation:up .25s ease-out;display:flex;flex-direction:column;gap:12px;box-shadow:0 -6px 0 #0d1022}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet h2{font-size:1.4rem}
.sheetHead{display:flex;align-items:center;gap:12px}
.sheetHead .big{font-size:2.4rem}
.sheetHead p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.close{margin-left:auto;font-size:1.3rem;width:40px;height:40px;border-radius:6px;background:var(--navy-2);border:2px solid var(--navy-3);flex:none}
.bimg{display:block;width:100%;max-height:200px;object-fit:contain;background:radial-gradient(ellipse at 50% 70%,rgba(200,85,43,.35),transparent 70%);border-radius:6px}
.buildGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--navy-2);border:2px solid var(--navy-3);border-radius:6px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0;box-shadow:var(--bevel)}
.card .thumb{height:64px;display:grid;place-items:center;font-size:2.2rem;background:radial-gradient(ellipse at 50% 80%,rgba(200,85,43,.3),transparent 70%)}
.card .thumb img{max-height:64px;max-width:100%;object-fit:contain}
.card b{font-family:var(--display);font-size:1rem;line-height:1.1}
.card .stats{font-size:.74rem;font-weight:800;display:flex;flex-wrap:wrap;gap:3px 8px}
.card .why{font-size:.72rem;color:var(--warn);font-weight:800}
.card .desc{font-size:.75rem;color:var(--muted);line-height:1.35}
.card.no{opacity:.5}
.card:not(.no):active{border-color:var(--gold)}
.tagTemp{font-size:.6rem;font-weight:800;letter-spacing:.1em;color:var(--navy);background:var(--muted);padding:1px 5px;border-radius:3px;align-self:flex-start}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1;font-size:1rem;padding:12px 10px}
.info{line-height:1.5;margin:0}
.statline{display:flex;flex-wrap:wrap;gap:6px}
.statline span{background:var(--navy-2);border-radius:4px;padding:4px 8px;font-size:.8rem;font-weight:800}
.event .big{font-size:3rem}
.opt{background:var(--navy-2);border:2px solid var(--navy-3);border-radius:6px;padding:12px 14px;text-align:left;font-weight:800;line-height:1.35;box-shadow:var(--bevel)}
.opt:active{border-color:var(--gold)}
.opt small{display:block;color:var(--muted);font-weight:700;font-size:.78rem;margin-top:2px}
.opt.right{border-color:var(--good);background:#1f3a2c}
.opt.wrong{border-color:var(--bad);background:#3a1f28}
.sec{font-family:var(--display);font-size:.95rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-top:4px}
.mlist{display:flex;flex-direction:column;gap:6px}
.mlist div{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;line-height:1.35;padding:6px 8px;border-radius:5px;background:var(--navy-2)}
.mlist div.done{opacity:.6}
.mlist div.cur{outline:2px solid var(--gold)}
.log{display:flex;flex-direction:column;gap:4px;font-size:.84rem;line-height:1.4;color:var(--muted)}
.log b{color:var(--ink)}
.toast{position:fixed;left:50%;top:44%;transform:translateX(-50%);z-index:30;background:var(--navy);border:2px solid var(--gold);
  border-radius:6px;padding:10px 16px;font-weight:800;max-width:min(90vw,360px);text-align:center;box-shadow:0 6px 0 #0d1022,0 10px 30px rgba(0,0,0,.5);animation:fade .2s}
.solflash{position:fixed;inset:0;z-index:15;display:grid;place-items:center;pointer-events:none;font-family:var(--display);font-weight:700;font-size:3.4rem;
  color:var(--cream);text-shadow:0 4px 0 var(--navy),0 0 30px var(--rust);animation:flash 1s forwards}
@keyframes flash{0%{opacity:0;transform:scale(.8)}25%{opacity:1;transform:scale(1)}100%{opacity:0}}
#end h1{font-size:2.3rem}
.endStats{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(340px,100%)}
.endStats div{background:var(--navy);border:2px solid var(--navy-3);border-radius:6px;padding:10px}
.endStats b{display:block;font-family:var(--display);font-size:1.6rem}
.endStats span{font-size:.75rem;color:var(--muted)}
@media (max-height:680px){.res .chip .k{display:none}.mission .txt small{display:none}.heroImg{width:min(260px,70vw)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="sky" aria-hidden="true"></canvas>

<!-- Portada -->
<section class="screen gutter" id="title">
  <img class="heroImg" src="assets/base.png" alt="Base central de la colonia">
  <div class="logo"><span class="y">PROYECTO ARES · 2050</span><span class="n">MISIÓN MARTE</span></div>
  <p class="tag">Dirige a la primera tripulación y convierte un cráter rojo y helado en el nuevo hogar de la humanidad.</p>
  <div class="stack">
    <button class="btn" id="bNew">Nueva misión</button>
    <button class="btn ghost" id="bCont" hidden>Continuar partida</button>
  </div>
</section>

<!-- Historia -->
<section class="screen gutter" id="story" hidden>
  <canvas id="storyArt" width="520" height="520"></canvas>
  <p class="storyText" id="storyText"></p>
  <div class="dots" id="storyDots"></div>
  <div class="stack"><button class="btn" id="bStory">Siguiente</button></div>
</section>

<!-- Tripulación -->
<section class="screen gutter" id="crew" hidden>
  <h2>Prepara tu tripulación</h2>
  <div class="field"><label for="cmdName">Nombre del comandante</label><input id="cmdName" maxlength="16" placeholder="Escribe tu nombre" autocomplete="off"></div>
  <p class="hint" id="crewHint">Elige 3 especialistas. Cada uno ayuda en algo distinto.</p>
  <div class="crewGrid" id="crewGrid"></div>
  <div class="stack" style="padding-bottom:20px"><button class="btn" id="bLaunch" disabled>¡Despegar!</button></div>
</section>

<!-- Viaje -->
<section class="screen gutter" id="travel" hidden>
  <h2 id="travelTitle">Viaje a Marte</h2>
  <canvas id="travelArt" width="680" height="300"></canvas>
  <div class="bar"><i id="travelBar"></i></div>
  <p class="hint" id="travelDay">Día 0 de 90</p>
  <div class="fact" id="travelFact"></div>
  <div class="stack"><button class="btn" id="bLand" disabled>Aterrizar</button></div>
</section>

<!-- Juego -->
<section class="screen" id="game" hidden>
  <header class="hud gutter">
    <div class="hudTop">
      <div class="sol" id="solLbl">SOL 1</div>
      <div class="status" id="statusPills"></div>
    </div>
    <div class="res" id="res"></div>
    <div class="meters" id="meters"></div>
    <button class="mission" id="missionBtn"></button>
  </header>
  <main class="mapwrap" id="mapwrap">
    <canvas id="mapCanvas" aria-label="Mapa isométrico del cráter. Arrastra para moverte y pellizca para hacer zoom."></canvas>
    <div class="mapTools">
      <button class="panel" id="zIn" aria-label="Acercar">+</button>
      <button class="panel" id="zOut" aria-label="Alejar">−</button>
      <button class="panel" id="zHome" aria-label="Centrar en la base" style="font-size:1.1rem">⌂</button>
    </div>
    <div class="placeBar gutter" id="placeBar" hidden>
      <div class="panel"><img id="pbImg" alt=""><div class="msg" id="pbMsg"></div></div>
      <div class="row"><button class="btn ghost" id="pbCancel">✕ Cancelar</button><button class="btn" id="pbOk">✓ Construir</button></div>
    </div>
  </main>
  <footer class="actions gutter" id="actions">
    <button class="iconBtn" id="bLog">📜<small>Diario</small></button>
    <button class="iconBtn build" id="bBuild">🏗️<small>Construir</small></button>
    <button class="btn next" id="bNext">Nuevo sol ▸</button>
    <button class="iconBtn" id="bMenu">⚙️<small>Menú</small></button>
  </footer>
</section>

<!-- Final -->
<section class="screen gutter" id="end" hidden>
  <div style="font-size:4rem" id="endIcon">🏙️</div>
  <h1 id="endTitle">¡Colonia autosuficiente!</h1>
  <p class="tag" id="endText"></p>
  <div class="endStats" id="endStats"></div>
  <div class="stack">
    <button class="btn" id="bEndMain">Jugar otra vez</button>
    <button class="btn ghost" id="bEndKeep" hidden>Seguir construyendo</button>
  </div>
</section>

<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const N=30, TW=64, TH=32, SAVE='ares2050-iso';
const OX=N*TW/2+TW/2, OY=TH;                 // origen del mapa en el lienzo del terreno
const WORLD_W=N*TW+TW, WORLD_H=N*TH+TH*2+24;

/* ================= DATOS ================= */
const CREW=[
  {id:'ing',face:'👩‍🔧',name:'Ingeniera Vega',role:'Energía',txt:'Los paneles solares dan un 25% más de energía.'},
  {id:'bot',face:'👨‍🌾',name:'Botánico Ruiz',role:'Cultivos',txt:'Los cultivos producen un 25% más de comida.'},
  {id:'med',face:'👩‍⚕️',name:'Doctora Amaya',role:'Salud',txt:'La tripulación se recupera más rápido y sufre menos daño.'},
  {id:'geo',face:'🧑‍🔬',name:'Geólogo Tanaka',role:'Minerales',txt:'Los rovers mineros sacan un 25% más de materiales.'},
  {id:'psi',face:'🧑‍🏫',name:'Psicóloga Nkosi',role:'Ánimo',txt:'Ayuda a que el equipo no se sienta solo ni triste.'}
];

// e: energía (+produce / -consume). p: producción por sol. pr: prioridad eléctrica. un: misión que lo desbloquea.
// fp: lado de la huella en baldosas. img: sprite. s: escala del sprite sobre la huella. dy: ajuste vertical. ph: marcador temporal.
const B={

const IMG={};
const IMG_NAMES=['base','pasillo','cruce','solar','moxie','extractor','rover','laboratorio','invernadero','refugio','habitat','habitat_interior','comedor','taller','granja','cajas'];
const imgSrc=n=>`assets/${n}.png`;
function mkSprite(src){
  const sp={ok:false,w:1,h:1,img:null,dim:null,mask:null};
  const im=new Image();im.onload=()=>{sp.img=im;sp.w=im.naturalWidth;sp.h=im.naturalHeight;sp.ok=true;bake(sp)};im.src=src;return sp;
}
function bake(sp){ // versión oscurecida (apagado) + máscara alfa para tocar con precisión
  const c=document.createElement('canvas');c.width=sp.w;c.height=sp.h;const x=c.getContext('2d');
  x.drawImage(sp.img,0,0);
  try{const d=x.getImageData(0,0,sp.w,sp.h).data;sp.mask=new Uint8Array(sp.w*sp.h);for(let i=0;i<sp.w*sp.h;i++)sp.mask[i]=d[i*4+3]>40?1:0}catch(e){sp.mask=null}
  x.globalCompositeOperation='source-atop';x.fillStyle='rgba(16,18,40,.62)';x.fillRect(0,0,sp.w,sp.h);sp.dim=c;
}
IMG_NAMES.forEach(n=>IMG[n]=mkSprite(imgSrc(n)));
// Marcadores temporales: caja isométrica con los colores de los módulos y el icono del edificio.
function placeholder(emoji,fp){
  const k=2,w=fp*TW*k,hh=Math.round(fp*20*k),h=w/2+hh+10*k;
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  const top=10*k, mid=top+w/4, bot=top+w/2;
  const P=(pts,f)=>{x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.fillStyle=f;x.fill()};
  const L=[0,mid],R=[w,mid],T=[w/2,top],D=[w/2,bot];
  P([L,D,[D[0],D[1]+hh],[L[0],L[1]+hh]],'#cfc9ba');
  P([D,R,[R[0],R[1]+hh],[D[0],D[1]+hh]],'#a7a193');
  P([[L[0],L[1]+hh*.7],[D[0],D[1]+hh*.7],[D[0],D[1]+hh],[L[0],L[1]+hh]],'#2e3866');
  P([[D[0],D[1]+hh*.7],[R[0],R[1]+hh*.7],[R[0],R[1]+hh],[D[0],D[1]+hh]],'#222a4c');
  P([T,R,D,L],'#ebe6d8');
  x.strokeStyle='#1a1f3a';x.lineWidth=2*k;x.beginPath();x.moveTo(L[0],L[1]);x.lineTo(T[0],T[1]);x.lineTo(R[0],R[1]);x.lineTo(R[0],R[1]+hh);x.lineTo(D[0],D[1]+hh);x.lineTo(L[0],L[1]+hh);x.closePath();x.stroke();
  x.beginPath();x.moveTo(L[0],L[1]);x.lineTo(D[0],D[1]);x.lineTo(R[0],R[1]);x.moveTo(D[0],D[1]);x.lineTo(D[0],D[1]+hh);x.stroke();
  x.font=`${Math.round(w*.26)}px serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(emoji,w/2,mid-2*k);
  x.setLineDash([4*k,3*k]);x.strokeStyle='rgba(216,171,76,.9)';x.lineWidth=k;x.strokeRect(k,k,w-2*k,h-2*k);
  const sp={ok:true,w,h,img:c,ph:true};bake(sp);sp.url=c.toDataURL();return sp;
}

let S=null, pickedCrew=[], sound=true;
let selB=-1;                 // edificio seleccionado
let placing=null;            // {t,i,j}
const count=(s,t)=>s.blds.filter(b=>b.t===t).length;
const has=(s,id)=>s.crew.includes(id);
const idx=(i,j)=>j*N+i;
const inMap=(i,j)=>i>=0&&j>=0&&i<N&&j<N;

function hash(i,j){let h=(i*374761393+j*668265263)^0x5bd1e995;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296}

function newGame(name,crew){
  const map=new Array(N*N).fill('soil');
  const B0=[13,13];  // base 3×3 en el centro
  const near=(i,j,d)=>Math.abs(i-(B0[0]+1))<=d&&Math.abs(j-(B0[1]+1))<=d;
  const blob=(ci,cj,r,type)=>{for(let j=cj-3;j<=cj+3;j++)for(let i=ci-3;i<=ci+3;i++){if(!inMap(i,j))continue;const d=Math.hypot(i-ci,j-cj)+hash(i,j)*.9;if(d<r&&map[idx(i,j)]==='soil'&&!near(i,j,2))map[idx(i,j)]=type}};
  const craters=[];
  for(let k=0;k<9;k++){let x,y,r,tries=0;do{x=2+Math.random()*(N-4);y=2+Math.random()*(N-4);r=1.2+Math.random()*2.2;tries++}
    while(tries<60&&(Math.hypot(x-14.5,y-14.5)<r+5||craters.some(c=>Math.hypot(c.x-x,c.y-y)<c.r+r+1)));
    craters.push({x,y,r});
    for(let j=0;j<N;j++)for(let i=0;i<N;i++)if(Math.hypot(i+.5-x,j+.5-y)<r-.25)map[idx(i,j)]='crater';}
  blob(14,19,2.2,'ice');blob(19,14,2,'rock');
  for(let k=0;k<5;k++)blob(rnd(N),rnd(N),1.5+Math.random()*1.8,'ice');
  for(let k=0;k<6;k++)blob(rnd(N),rnd(N),1.3+Math.random()*1.5,'rock');
  for(let k=0;k<4;k++){const i=rnd(N-2)+1,j=rnd(N-2)+1;if(map[idx(i,j)]==='soil'&&!near(i,j,3))map[idx(i,j)]='tube'}
  map[idx(17,11)]='tube';
  const blds=[{id:1,t:'base',i:B0[0],j:B0[1],on:true,broken:false},{id:2,t:'solar',i:16,j:14,on:true,broken:false}];
  map[idx(16,14)]='soil';
  const crates=[[12,17],[18,11],[10,13],[17,17],[13,10]].map(([i,j])=>({i,j}));
  crates.forEach(c=>{map[idx(c.i,c.j)]='soil'});
  return {v:2,name:name||'Comandante',crew,sol:1,pop:4,o2:22,agua:24,comida:32,mat:45,bat:10,salud:90,moral:70,
    storm:0,cold:0,dirty:0,mission:0,map,craters,blds,nextId:3,crates,log:[],facts:[],won:false,lastShip:1,stats:{built:2,quiz:0,events:0}};
}

/* ---------- ocupación del mapa ---------- */
const OCC=new Int32Array(N*N);
function rebuildOcc(){OCC.fill(-1);S.blds.forEach((b,k)=>{const f=B[b.t].fp;for(let j=b.j;j<b.j+f;j++)for(let i=b.i;i<b.i+f;i++)OCC[idx(i,j)]=k})}
function footprint(b){const f=B[b.t].fp,a=[];for(let j=b.j;j<b.j+f;j++)for(let i=b.i;i<b.i+f;i++)a.push(S.map[idx(i,j)]);return a}
function validSpot(t,i0,j0){
  const b=B[t],f=b.fp;let ice=false;
  for(let j=j0;j<j0+f;j++)for(let i=i0;i<i0+f;i++){
    if(!inMap(i,j))return {ok:false,why:'Se sale del mapa.'};
    if(OCC[idx(i,j)]>=0)return {ok:false,why:'Ya hay un edificio aquí.'};
    if(S.crates.some(c=>c.i===i&&c.j===j))return {ok:false,why:'Recoge primero la caja de carga.'};
    const tt=S.map[idx(i,j)];
    if(tt==='crater'&&!b.crater)return {ok:false,why:'No se puede construir dentro de un cráter.'};
    if(tt==='ice')ice=true;
  }
  if(b.need==='ice'&&!ice)return {ok:false,why:'Tiene que tocar al menos una baldosa de hielo ❄️.'};
  return {ok:true,why:''};
}

/* ================= SIMULACIÓN ================= */
const poweredHas=(s,type)=>s.blds.some(b=>b.t===type&&b.on&&!b.broken);
function solarFactor(s){
  let f=1;
  if(s.storm>0)f*=has(s,'ing')?0.35:0.3;
  if(s.dirty>0)f*=0.5;
  if(poweredHas(s,'repair'))f=Math.min(1,f*1.6);
  return f;
}
function flows(s){
  const f={eProd:0,eDem:0,heat:0,powered:new Set(),unpowered:new Set(),d:{o2:0,agua:0,comida:0,mat:0},cap:0,batMax:20,heatOk:true};
  const sf=solarFactor(s),cons=[];
  s.blds.forEach((t,k)=>{
    const b=B[t.t];
    if(b.cap&&!t.broken)f.cap+=b.cap*(t.t==='habitat'&&footprint(t).includes('tube')?2:1);
    if(b.store&&!t.broken)f.batMax+=b.store;
    if(t.broken||!t.on)return;
    if(b.e>0){f.eProd+=t.t==='solar'?b.e*sf*(has(s,'ing')?1.25:1):b.e;f.powered.add(k)}
    else if(b.e===0)f.powered.add(k);
    else cons.push({k,e:-b.e,pr:b.pr??9});
  });
  f.eProd=Math.round(f.eProd*10)/10;
  f.heat=Math.ceil(s.pop*0.25*(s.cold>0?2:1));
  let avail=f.eProd+s.bat-f.heat;
  if(avail<0){f.heatOk=false;avail=0}
  cons.sort((a,b)=>a.pr-b.pr);
  f.eDem=f.heat;
  for(const c of cons){f.eDem+=c.e;if(avail>=c.e){avail-=c.e;f.powered.add(c.k)}else f.unpowered.add(c.k)}
  f.batNext=Math.min(f.batMax,Math.round(avail));
  const mf=s.moral<30?0.75:1;
  f.powered.forEach(k=>{
    const t=s.blds[k],b=B[t.t];if(!b.p)return;
    for(const r in b.p){
      let v=b.p[r];
      if(v>0){
        v*=mf;
        if(r==='comida'&&(t.t==='farm'||t.t==='vfarm')&&has(s,'bot'))v*=1.25;
        if(r==='mat'){if(footprint(t).includes('rock'))v*=2;if(has(s,'geo'))v*=1.25}
      }
      f.d[r]+=v;
    }
  });
  for(const r in f.d)f.d[r]=Math.round(f.d[r]);
  f.d.o2-=s.pop;f.d.agua-=s.pop;f.d.comida-=s.pop;
  return f;
}

function nextSol(){
  const s=S,f=flows(s),msgs=[];
  const before={o2:s.o2,agua:s.agua,comida:s.comida,mat:s.mat};
  let short=0;
  for(const k of ['o2','agua','comida','mat'])s[k]+=f.d[k];
  const names={o2:'el oxígeno',agua:'el agua',comida:'la comida'};
  for(const k of ['o2','agua','comida']){if(s[k]<0){short++;msgs.push(`¡Se acabó ${names[k]}! La tripulación pierde salud.`);s[k]=0}}
  s.mat=Math.max(0,s.mat);
  s.bat=f.batNext;
  const dmg=has(s,'med')?9:12;
  if(short)s.salud-=dmg*short;
  if(!f.heatOk){s.salud-=has(s,'med')?6:9;msgs.push('No hay energía para la calefacción. ¡Hace muchísimo frío!')}
  if(!short&&f.heatOk)s.salud+=2+(has(s,'med')?2:0);
  const on=t=>s.blds.some((b,k)=>b.t===t&&f.powered.has(k));
  if(on('gym')){s.salud+=3;s.moral+=3}
  if(on('mess'))s.moral+=3;
  if(on('shield'))s.moral+=2;
  s.moral+=Math.min(3,Math.floor(count(s,'corridor')/3));
  if(has(s,'psi'))s.moral+=2;
  if(s.pop>f.cap){s.moral-=6;msgs.push('Hay más colonos que camas. El equipo está incómodo.')}
  if(s.salud<40)s.moral-=3;
  s.moral+=(60-s.moral)*0.06;
  s.salud=clamp(Math.round(s.salud),0,100);s.moral=clamp(Math.round(s.moral),0,100);
  if(f.unpowered.size)msgs.push(`${f.unpowered.size} edificio(s) se quedaron sin energía.`);
  if(s.storm>0){s.storm--;if(!s.storm)msgs.push('La tormenta de polvo ha terminado. ¡Vuelve el Sol!')}
  if(s.cold>0)s.cold--;
  if(s.dirty>0)s.dirty--;
  if(poweredHas(s,'repair')){const br=s.blds.find(t=>t.broken);if(br){br.broken=false;msgs.push('Los robots del taller han arreglado una avería.')}}
  s.sol++;
  addLog(`Sol ${s.sol}: `+(msgs.length?msgs.join(' '):'Todo funciona con normalidad.'));
  flashSol();floatDeltas(before);
  if(short||!f.heatOk)beep(180,.25,'sawtooth');else beep(520,.08);
  checkMissions();
  if(s.salud<=0){save();return endGame(false)}
  const q=[];
  if(poweredHas(s,'antenna')&&s.sol-s.lastShip>=6){s.lastShip=s.sol;q.push(evShip())}
  else if(s.sol>=3&&Math.random()<0.4){const e=randomEvent();if(e)q.push(e)}
  if(msgs.length&&!q.length&&(short||!f.heatOk))toast(msgs[0]);
  save();render();runQueue(q);
}

function checkMissions(){
  const s=S;
  while(s.mission<MISSIONS.length&&MISSIONS[s.mission].ok(s)){
    const m=MISSIONS[s.mission];s.mission++;s.mat+=m.r;
    addLog(`<b>Misión cumplida:</b> ${m.t}${m.r?` (+${m.r} materiales)`:''}`);
    toast(`✅ ¡Misión cumplida! ${m.r?`+${m.r} 🧱`:''}`);beep(660,.1);setTimeout(()=>beep(880,.15),110);
    if(s.mission===MISSIONS.length&&!s.won){s.won=true;save();setTimeout(()=>endGame(true),900);return}
  }
}

  for(const it of items){
    if(it.crate){const sp=IMG.cajas;if(!sp.ok)continue;const [X,Y]=tileTop(it.b.i,it.b.j);const w=TW*.62,h=w*sp.h/sp.w,bob=Math.sin(t*3+it.b.i)*1.5;
      x.fillStyle='rgba(0,0,0,.25)';x.beginPath();x.ellipse(X,Y+TH*.62,w*.45,w*.18,0,0,7);x.fill();
      x.drawImage(sp.img,X-w/2,Y+TH*.75-h+bob,w,h);
      x.fillStyle='rgba(246,220,154,'+(.55+Math.sin(t*4)*.35)+')';x.beginPath();x.arc(X,Y+TH*.75-h-6+bob,3.2,0,7);x.fill();continue}
    const b=it.b;let sp=SPR[b.t],flip=false;
    if(b.t==='corridor'&&!it.ghost){const sh=corridorShape(b);if(sh==='cross')sp=IMG.cruce;flip=sh==='flip'}
    if(!sp||!sp.ok)continue;
    const r=spriteBox(b,b.t,sp);
    const off=!it.ghost&&(b.broken||!b.on||f.unpowered.has(it.k));
    if(it.ghost)x.globalAlpha=.72+Math.sin(t*6)*.12;
    const src=off&&sp.dim?sp.dim:sp.img;
    if(flip){x.save();x.translate(r.x+r.w/2,0);x.scale(-1,1);x.drawImage(src,-r.w/2,r.y,r.w,r.h);x.restore()}
    else x.drawImage(src,r.x,r.y,r.w,r.h);
    x.globalAlpha=1;
    if(!it.ghost){
      let flag='';if(b.broken)flag='🔧';else if(!b.on)flag='⏸️';else if(f.unpowered.has(it.k))flag='⚡';
      if(flag){const fx=r.x+r.w/2,fy=r.y+4;x.fillStyle='#120d16';x.strokeStyle='#e9e4d6';x.lineWidth=2;x.beginPath();x.arc(fx,fy,11,0,7);x.fill();x.stroke();
        x.font='13px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(flag,fx,fy+1)}
    }
  }
  x.restore();
  if(S.storm>0){x.fillStyle='rgba(200,120,60,.22)';x.fillRect(0,0,VW,VH);x.fillStyle='rgba(240,178,122,.45)';
    for(const d of dust){d.x+=d.v*.004;if(d.x>1.05)d.x=-.05;x.fillRect(d.x*VW,d.y*VH+Math.sin(t+d.y*9)*8,d.r*1.6,d.r)}}
}
function clampCam(){cam.z=clamp(cam.z,.45,3);cam.x=clamp(cam.x,0,WORLD_W);cam.y=clamp(cam.y,0,WORLD_H)}
function focusTile(i,j){const [X,Y]=tileTop(i,j);cam.x=X;cam.y=Y+TH/2}
function focusBase(){const b=S.blds.find(b=>b.t==='base')||S.blds[0];const [X,Y]=tileTop(b.i+1,b.j+1);cam.x=X;cam.y=Y-10;
  cam.z=clamp(Math.min(VW/520,VH/400),.8,1.8)}
function zoomAt(f,sx,sy){const [wx,wy]=toWorld(sx,sy);cam.z=clamp(cam.z*f,.45,3);const [nx,ny]=toWorld(sx,sy);cam.x+=wx-nx;cam.y+=wy-ny;clampCam()}

/* ---------- toques, arrastre y pellizco ---------- */
const ptrs=new Map();let drag=null,pinch=null;
const pos=e=>{const r=mc.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};
mc.addEventListener('pointerdown',e=>{try{mc.setPointerCapture(e.pointerId)}catch(_){}const p=pos(e);ptrs.set(e.pointerId,p);
  if(ptrs.size===1)drag={sx:p.x,sy:p.y,cx:cam.x,cy:cam.y,moved:false};
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:cam.z};if(drag)drag.moved=true}});
mc.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const p=pos(e);ptrs.set(e.pointerId,p);
  if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);zoomAt(pinch.z*d/pinch.d/cam.z,(a.x+b.x)/2,(a.y+b.y)/2);return}
  if(drag&&ptrs.size===1){const dx=p.x-drag.sx,dy=p.y-drag.sy;if(Math.hypot(dx,dy)>8)drag.moved=true;
    if(drag.moved){cam.x=drag.cx-dx/cam.z;cam.y=drag.cy-dy/cam.z;clampCam();mc.style.cursor='grabbing'}}});
const endPtr=e=>{if(!ptrs.has(e.pointerId))return;const p=pos(e);ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinch=null;
  if(ptrs.size===0){if(drag&&!drag.moved&&e.type==='pointerup')tapMap(p.x,p.y);drag=null;mc.style.cursor='grab'}
  else if(ptrs.size===1){const q=[...ptrs.values()][0];drag={sx:q.x,sy:q.y,cx:cam.x,cy:cam.y,moved:true}}};
mc.addEventListener('pointerup',endPtr);mc.addEventListener('pointercancel',endPtr);
mc.addEventListener('wheel',e=>{e.preventDefault();const p=pos(e);zoomAt(e.deltaY<0?1.12:1/1.12,p.x,p.y)},{passive:false});
$('#zIn').onclick=()=>zoomAt(1.25,VW/2,VH/2);
$('#zOut').onclick=()=>zoomAt(1/1.25,VW/2,VH/2);
$('#zHome').onclick=()=>{focusBase();clampCam()};

function hitBuilding(wx,wy){
  const order=S.blds.map((b,k)=>({b,k,d:b.i+b.j+2*B[b.t].fp})).sort((a,b)=>b.d-a.d);
  for(const o of order){if(o.b.t==='corridor')continue;const sp=SPR[o.b.t];if(!sp.ok)continue;const r=spriteBox(o.b,o.b.t);
    if(wx<r.x||wy<r.y||wx>r.x+r.w||wy>r.y+r.h)continue;
    if(sp.mask){const px=((wx-r.x)/r.w*sp.w)|0,py=((wy-r.y)/r.h*sp.h)|0;if(!sp.mask[py*sp.w+px])continue}
    return o.k}
  return -1;
}
function tapMap(sx,sy){
  if($('#veil'))return;
  const [wx,wy]=toWorld(sx,sy),[ti,tj]=worldToTile(wx,wy);
  if(placing){const f=B[placing.t].fp;placing.i=ti-Math.floor((f-1)/2);placing.j=tj-Math.floor((f-1)/2);updatePlaceBar();beep(400,.03);return}
  const ci=S.crates.findIndex(c=>c.i===ti&&c.j===tj);
  if(ci>=0)return openCrate(ci);
  let k=hitBuilding(wx,wy);
  if(k<0&&inMap(ti,tj))k=OCC[idx(ti,tj)];
  if(k>=0){selB=k;return openBuilding(k)}
  if(inMap(ti,tj))openTile(ti,tj);
}

}
function openLog(){
  const ml=MISSIONS.map((m,i)=>`<div class="${i<S.mission?'done':i===S.mission?'cur':''}"><span>${i<S.mission?'✅':i===S.mission?'🎯':'⬜'}</span><span><b>${m.t}</b>${i===S.mission?`<br><span class="hint">${m.h}</span>`:''}</span></div>`).join('');
  const crew=S.crew.map(id=>CREW.find(c=>c.id===id)).map(c=>`${c.face} ${c.name}`).join(' · ');
  sheet(`<div class="sheetHead"><span class="big">📜</span><div><h2>Diario de a bordo</h2><p>${S.name} · ${crew}</p></div><button class="close" data-close aria-label="Cerrar">✕</button></div>
    <div class="sec">Misiones</div><div class="mlist">${ml}</div>
    <div class="sec">Datos aprendidos (${S.facts.length})</div><div class="log">${S.facts.map(f=>`<div>🔬 ${f}</div>`).join('')||'<div>Construye y vive aventuras para descubrir datos sobre Marte.</div>'}</div>
    <div class="sec">Registro</div><div class="log">${S.log.slice(0,25).map(l=>`<div>${l}</div>`).join('')}</div>`);
}
function openMenu(){
  const v=sheet(`<div class="sheetHead"><span class="big">⚙️</span><div><h2>Menú</h2></div><button class="close" data-close aria-label="Cerrar">✕</button></div>
    <div class="sec">Cómo jugar</div>
    <div class="log" style="color:var(--ink)">
      <div>1. <b>Arrastra</b> el mapa para moverte y <b>pellizca</b> (o usa + y −) para hacer zoom.</div>
      <div>2. Pulsa <b>Construir</b> o toca el suelo, elige un edificio y colócalo. Toca un edificio para verlo, apagarlo o repararlo.</div>
      <div>3. Cada colono gasta cada sol <b>1 de oxígeno, 1 de agua y 1 de comida</b>. ¡Que no se acaben!</div>
      <div>4. Casi todos los edificios gastan <b>energía ⚡</b>. Si no hay suficiente, algunos se apagan. La <b>batería 🔋</b> guarda la que sobra.</div>
      <div>5. Recoge las <b>cajas de carga 📦</b> del mapa para conseguir materiales.</div>
      <div>6. Pulsa <b>Siguiente sol</b> para que pase un día marciano. Cumple las misiones y llega a <b>30 colonos</b> para ganar.</div>
    </div>
    <div class="row"><button class="btn ghost" id="mSnd">Sonido: ${sound?'sí':'no'}</button><button class="btn ghost" id="mRes">Reiniciar partida</button></div>
    <div class="row"><button class="btn ghost" id="mTitle">Volver a la portada</button></div>`);
  v.querySelector('#mSnd').onclick=()=>{sound=!sound;openMenu()};
  const r=v.querySelector('#mRes');r.onclick=()=>{if(!r.dataset.sure){r.dataset.sure=1;r.textContent='¿Seguro? Toca otra vez';return}
    try{localStorage.removeItem(SAVE)}catch(e){}S=null;closeSheet();toTitle();};
  v.querySelector('#mTitle').onclick=()=>{closeSheet();toTitle()};
}
function endGame(win){
  closeSheet();stopPlacing();show('end');
  $('#endIcon').textContent=win?'🏙️':'🪦';
  $('#endTitle').textContent=win?'¡Colonia autosuficiente!':'Misión fallida';
  $('#endText').textContent=win?`¡Enhorabuena, ${S.name}! Gracias a tus decisiones, ${S.pop} personas viven en Marte con oxígeno, agua, comida y energía propios. La humanidad tiene un nuevo hogar.`
    :`La tripulación no ha podido seguir. En Marte hay que vigilar el oxígeno, el agua, la comida y la energía a la vez. ¡Seguro que la próxima vez lo consigues!`;
  $('#endStats').innerHTML=`<div><b>${S.sol}</b><span>soles en Marte</span></div><div><b>${S.pop}</b><span>colonos</span></div>
    <div><b>${S.stats.built}</b><span>edificios construidos</span></div><div><b>${S.facts.length}</b><span>datos aprendidos</span></div>`;
  $('#bEndKeep').hidden=!win;
  if(!win){try{localStorage.removeItem(SAVE)}catch(e){}}
  beep(win?660:150,.3,win?'triangle':'sawtooth');
}

/* ================= FLUJO DE PANTALLAS ================= */
function toTitle(){stopPlacing();show('title');let h=false;try{h=!!localStorage.getItem(SAVE)}catch(e){}$('#bCont').hidden=!(h||S)}
let storyI=0;
function startStory(){storyI=0;show('story');drawStory()}
function drawStory(){
  const s=STORY[storyI];$('#storyText').textContent=s.t;storyArt=s.art;
  $('#storyDots').innerHTML=STORY.map((_,i)=>`<i class="${i===storyI?'on':''}"></i>`).join('');
  $('#bStory').textContent=storyI===STORY.length-1?'Elegir tripulación':'Siguiente';
}
function startCrew(){
  show('crew');pickedCrew=[];
  const g=$('#crewGrid');
  g.innerHTML=CREW.map(c=>`<button class="crewCard" data-id="${c.id}"><span class="face">${c.face}</span><b>${c.name}</b><span>${c.role}: ${c.txt}</span></button>`).join('');
  g.querySelectorAll('.crewCard').forEach(b=>b.onclick=()=>{
    const id=b.dataset.id,k=pickedCrew.indexOf(id);
    if(k>=0)pickedCrew.splice(k,1);else{if(pickedCrew.length>=3)pickedCrew.shift();pickedCrew.push(id)}
    g.querySelectorAll('.crewCard').forEach(x=>x.classList.toggle('sel',pickedCrew.includes(x.dataset.id)));
    $('#crewHint').textContent=pickedCrew.length<3?`Elige ${3-pickedCrew.length} especialista(s) más.`:'¡Tripulación lista! Tú eres el cuarto miembro.';
    $('#bLaunch').disabled=pickedCrew.length<3;beep(500,.04);
  });
}
let travelT0=0;
function startTravel(){
  const name=$('#cmdName').value.trim()||'Comandante';
  S=newGame(name,pickedCrew.slice());terrainDirty=true;
  addLog(`Sol 1: ¡Aterrizaje completado! La tripulación de ${S.name} llega al cráter.`);
  learn(B.base.fact);
  show('travel');travelT0=performance.now();$('#bLand').disabled=true;let fi=0;
  $('#travelFact').innerHTML=`<b>Dato del viaje</b>${TRAVEL_FACTS[0]}`;
  const iv=setInterval(()=>{if(skyMode!=='travel')return clearInterval(iv);fi=(fi+1)%TRAVEL_FACTS.length;$('#travelFact').innerHTML=`<b>Dato del viaje</b>${TRAVEL_FACTS[fi]}`},2600);
  beep(120,.6,'sawtooth');
}
function startGame(){
  show('game');selB=-1;stopPlacing();rebuildOcc();terrainDirty=true;render();
  resizeMap();focusBase();clampCam();
  if(S.sol===1&&S.log.length<=1)setTimeout(()=>sheet(`<div class="sheetHead"><span class="big">👩‍🚀</span><div><h2>¡Bienvenido a Marte, ${S.name}!</h2><p>Sol 1 · Cráter preparado por los robots</p></div></div>
    <img class="bimg" src="${imgSrc('base')}" alt="Base central">
    <p class="info">Este cráter tiene <b>hielo azul</b>, <b>rocas grises con minerales</b>, <b>tubos de lava</b> y cráteres pequeños. La base central y un panel solar ya funcionan, y hay <b>cajas de carga 📦</b> esperando cerca.</p>
    <p class="info">El oxígeno que trajisteis solo dura unos pocos soles. ¡Sigue las misiones!</p>
    <div class="fact" style="max-width:none"><b>Controles</b>Arrastra para mover la cámara y pellizca para hacer zoom. Pulsa Construir para colocar edificios.</div>
    <div class="stack" style="width:100%"><button class="btn" data-close>¡A trabajar!</button></div>`),400);
}
function save(){try{if(S)localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(SAVE);if(r){const s=JSON.parse(r);if(s&&s.v===2)return s}}catch(e){}return null}

$('#bNew').onclick=()=>{initAudio();startStory()};
$('#bCont').onclick=()=>{initAudio();if(!S)S=load();if(S)startGame()};
$('#bStory').onclick=()=>{beep(500,.04);if(storyI<STORY.length-1){storyI++;drawStory()}else startCrew()};
$('#bLaunch').onclick=()=>startTravel();
$('#bLand').onclick=()=>startGame();
$('#bNext').onclick=()=>{if(!$('#veil')&&!placing)nextSol()};
$('#bBuild').onclick=openBuildMenu;
$('#bLog').onclick=openLog;
$('#bMenu').onclick=openMenu;
$('#missionBtn').onclick=openLog;
$('#bEndMain').onclick=()=>{S=null;try{localStorage.removeItem(SAVE)}catch(e){}toTitle()};
$('#bEndKeep').onclick=()=>startGame();
window.addEventListener('resize',()=>{if(!$('#game').hidden){resizeMap();clampCam()}});

/* ================= SONIDO ================= */
let AC=null;
function initAudio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function beep(fr,d,type){
  if(!sound||!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=fr;
  g.gain.setValueAtTime(.05,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d+.02)}catch(e){}
}

/* ================= CIELO Y DIBUJOS ================= */
const sky=$('#sky'),cx=sky.getContext('2d');
let skyMode='title',storyArt='earth',stars=[];const dust=[];
function resizeSky(){const r=devicePixelRatio||1;sky.width=innerWidth*r;sky.height=innerHeight*r;cx.setTransform(r,0,0,r,0,0);
  stars=Array.from({length:120},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()<.2?2:1,p:Math.random()*6}))}
resizeSky();addEventListener('resize',resizeSky);
for(let i=0;i<90;i++)dust.push({x:Math.random(),y:Math.random(),v:.2+Math.random()*.8,r:1+Math.random()*2.5});
function planet(c,x,y,r,kind,t){
  const g=c.createRadialGradient(x-r*.35,y-r*.35,r*.1,x,y,r);
  if(kind==='earth'){g.addColorStop(0,'#8fb7a8');g.addColorStop(.6,'#4a7380');g.addColorStop(1,'#26363c')}
  else{g.addColorStop(0,'#f2a36b');g.addColorStop(.55,'#c4562a');g.addColorStop(1,'#4a1a10')}
  c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill();
  c.save();c.beginPath();c.arc(x,y,r,0,7);c.clip();
  if(kind==='earth'){
    c.fillStyle='#8a7a4c';for(let i=0;i<5;i++){c.beginPath();c.ellipse(x+Math.cos(i*1.9+t*.1)*r*.5,y+Math.sin(i*2.3)*r*.5,r*.28,r*.16,i,0,7);c.fill()}
    c.fillStyle='rgba(150,120,90,.45)';c.fillRect(x-r,y-r,r*2,r*2);
    c.fillStyle='rgba(200,170,120,.25)';for(let i=0;i<4;i++){c.beginPath();c.ellipse(x+Math.sin(t*.3+i)*r*.6,y-r*.6+i*r*.4,r*.7,r*.1,0,0,7);c.fill()}
  }else{
    c.fillStyle='rgba(80,25,12,.45)';[[-.3,-.2,.18],[.25,.1,.12],[-.05,.4,.09],[.4,-.35,.07]].forEach(([a,b,s])=>{c.beginPath();c.arc(x+a*r,y+b*r,s*r,0,7);c.fill()});
    c.fillStyle='rgba(255,255,255,.75)';c.beginPath();c.ellipse(x,y-r*.95,r*.22,r*.07,0,0,7);c.fill();
  }
  c.restore();
}
function rocket(c,x,y,s,ang,t){
  c.save();c.translate(x,y);c.rotate(ang);c.scale(s,s);
  c.fillStyle=`rgba(255,${150+Math.sin(t*20)*60|0},60,.9)`;c.beginPath();c.moveTo(-6,18);c.lineTo(0,34+Math.sin(t*25)*5);c.lineTo(6,18);c.fill();
  c.fillStyle='#e9e4d6';c.beginPath();c.moveTo(0,-26);c.quadraticCurveTo(10,-10,9,18);c.lineTo(-9,18);c.quadraticCurveTo(-10,-10,0,-26);c.fill();
  c.fillStyle='#2e3866';c.fillRect(-9,4,18,5);
  c.fillStyle='#222a4c';c.beginPath();c.moveTo(-9,8);c.lineTo(-16,22);c.lineTo(-8,18);c.fill();c.beginPath();c.moveTo(9,8);c.lineTo(16,22);c.lineTo(8,18);c.fill();
  c.fillStyle='#8fd8ec';c.beginPath();c.arc(0,-6,4,0,7);c.fill();
  c.restore();
}
function drawStoryArt(t){
  const cv=$('#storyArt'),c=cv.getContext('2d'),W=cv.width;c.clearRect(0,0,W,W);
  const m=W/2;
  if(storyArt==='earth'){planet(c,m,m,W*.36,'earth',t);c.fillStyle='rgba(255,120,60,.18)';c.beginPath();c.arc(m,m,W*.42,0,7);c.fill()}
  else if(storyArt==='mars'){c.fillStyle='rgba(208,88,44,.18)';c.beginPath();c.arc(m,m,W*.45,0,7);c.fill();planet(c,m,m,W*.36,'mars',t)}
  else if(storyArt==='robots'){
    c.fillStyle='#c4562a';c.beginPath();c.moveTo(0,W*.62);c.lineTo(m,W*.4);c.lineTo(W,W*.62);c.lineTo(m,W*.84);c.closePath();c.fill();
    c.fillStyle='#b8d8e4';c.beginPath();c.moveTo(m*.6,W*.7);c.lineTo(m*.9,W*.62);c.lineTo(m*1.1,W*.7);c.lineTo(m*.8,W*.77);c.fill();
    const rf=IMG.refugio,rv=IMG.rover;
    if(rf.ok){const w=W*.55;c.drawImage(rf.img,m-w*.35,W*.36,w,w*rf.h/rf.w)}
    if(rv.ok){const w=W*.26,p=(t*.12)%1;c.drawImage(rv.img,W*.05+p*W*.5,W*.62-w*rv.h/rv.w*.6+Math.sin(t*6)*2,w,w*rv.h/rv.w)}
    c.font=`${W*.1}px serif`;c.textAlign='center';c.fillText('🦠',m+W*.32,W*.3+Math.sin(t*2)*8);
  }else{
    planet(c,W*.2,W*.8,W*.16,'earth',t);planet(c,W*.82,W*.2,W*.12,'mars',t);
    const p=(t*.15)%1;rocket(c,W*.2+p*W*.6,W*.8-p*W*.6,2.2,Math.PI/4,t);
  }
}
function drawTravel(t){
  const cv=$('#travelArt'),c=cv.getContext('2d'),W=cv.width,H=cv.height;c.clearRect(0,0,W,H);
  const p=Math.min(1,(performance.now()-travelT0)/7000);
  c.strokeStyle='rgba(216,171,76,.45)';c.setLineDash([6,10]);c.lineWidth=3;c.beginPath();c.moveTo(70,H*.7);c.quadraticCurveTo(W/2,-20,W-70,H*.6);c.stroke();c.setLineDash([]);
  planet(c,70,H*.7,46,'earth',t);planet(c,W-70,H*.6,36,'mars',t);
  const q=1-p,x=q*q*70+2*q*p*W/2+p*p*(W-70),y=q*q*H*.7+2*q*p*(-20)+p*p*H*.6;
  const dx=2*q*(W/2-70)+2*p*(W-70-W/2),dy=2*q*(-20-H*.7)+2*p*(H*.6+20);
  rocket(c,x,y,1.6,Math.atan2(dy,dx)+Math.PI/2,t);
  $('#travelBar').style.width=(p*100)+'%';$('#travelDay').textContent=`Día ${Math.round(p*90)} de 90`;
  if(p>=1&&$('#bLand').disabled){$('#bLand').disabled=false;$('#travelTitle').textContent='¡Llegando a Marte!';beep(700,.2,'triangle')}
}
function loop(now){
  const t=now/1000,W=innerWidth,H=innerHeight;
  const storm=skyMode==='game'&&S&&S.storm>0;
  const g=cx.createLinearGradient(0,0,0,H);
  if(skyMode==='game'){g.addColorStop(0,storm?'#3a2214':'#140e1c');g.addColorStop(1,storm?'#5b3420':'#2a1420')}
  else{g.addColorStop(0,'#0b0812');g.addColorStop(1,'#25111a')}
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  for(const s of stars){cx.globalAlpha=Math.max(0,(storm?.15:.55)+Math.sin(t*1.5+s.p)*.3);cx.fillStyle='#f5f1e8';cx.fillRect(s.x|0,s.y|0,s.r,s.r)}
  cx.globalAlpha=1;
  if(skyMode==='title')planet(cx,W*.5,H+Math.min(W,H)*.25,Math.min(W,H)*.6,'mars',t);
  if(skyMode==='story')drawStoryArt(t);
  if(skyMode==='travel')drawTravel(t);
  if(skyMode==='game')drawMap(t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ================= ARRANQUE ================= */
function start(data){
  if(data&&data.S&&data.S.v===2){S=data.S;startGame();return}
  toTitle();
}
window.claude?.hot?.snapshot?.(()=>({S:skyMode==='game'?S:null}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
<!--ARTIFACT-END-->
</body>
</html>
